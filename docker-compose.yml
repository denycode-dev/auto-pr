services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/auto-pr?schema=public}
        OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
        QODEER_API_KEY: ${QODEER_API_KEY:-}
        OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-flash}
        AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-240000}
        BITBUCKET_BASE_URL: ${BITBUCKET_BASE_URL:-}
        BITBUCKET_ACCESS_TOKEN: ${BITBUCKET_ACCESS_TOKEN:-}
        SENIOR_USER_SLUG: ${SENIOR_USER_SLUG:-senior.lead}
    image: auto-pr-app:latest
    container_name: auto-pr-app
    restart: unless-stopped
    ports:
      - "2000:2000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/auto-pr?schema=public}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      QODEER_API_KEY: ${QODEER_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-flash}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-240000}
      BITBUCKET_BASE_URL: ${BITBUCKET_BASE_URL:-}
      BITBUCKET_ACCESS_TOKEN: ${BITBUCKET_ACCESS_TOKEN:-}
      SENIOR_USER_SLUG: ${SENIOR_USER_SLUG:-senior.lead}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: auto-pr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auto-pr
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auto-pr"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
